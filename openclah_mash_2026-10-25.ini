port: 7890
socks-port: 7891
redir-port: 7892
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
secret: ""

# ====================== DNS 隐私优先版（零泄漏设计，2026-10-25 重构）======================
# 设计原则：
# 1) 默认解析只有一条路：国外/未分类域名一律走代理通道的加密 DoH，不设 fallback、不与国内 DNS 竞速
# 2) 只有 geosite:cn / private 名单内的域名走国内加密 DoH，保国内速度
# 3) default-nameserver 仅用于解析 DoH 服务器自身的域名，只放国内解析，天生直连
# 4) respect-rules 打开：解析服务器自身的连接也按规则走，配合下方规则区顶部的解析出口钉定，双保险
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  respect-rules: true
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.home'
    - '*.localdomain'
    - 'stun.*'
    - 'time.*'
    - 'ntp.*'
    - 'localhost'
    - 'router.*'
    - '+.apple.com'
    - '+.icloud.com'
    - '+.mzstatic.com'
    - '+.mask.icloud.com'
    - '+.mask-h2.icloud.com'
    - '+.configuration.apple.com'
    - '+.push.apple.com'
    - '+.push-apple.com.akadns.net'
    - '+.aaplimg.com'
    - '+.cdn-apple.com'
    - '+.icloud-content.com'
    - '+.apple-cloudkit.com'
    - '+.app-attest.apple.com'
    - '+.ls.apple.com.akadns.net'
    - '+.itunes.apple.com'
    - '+.crashlytics.com'
    - '+.hcaptcha.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - '+.ipv6.microsoft.com'
    - '+.identrust.com'
    - '+.digicert.com'
    - '+.ocsp.digicert.com'
    - '+.crl.identrust.com'
    - '+.akamaiedge.net'
    - '+.windowsupdate.com'
    - '+.update.microsoft.com'
    - '+.qq.com'
    - '+.weixin.qq.com'
    - '+.tencent.com'
    - '+.tenpay.com'
    - '+.alipay.com'
    - '+.alipayobjects.com'
    - '+.bilibili.com'
    - '+.bilivideo.com'
    - '+.hdslb.com'
    - '+.acgvideo.com'
    - '+.xiaomi.com'
    - '+.mi.com'
    - '+.miui.com'
    - '+.tailscale.com'
    - '+.zerotier.com'
    - '+.parsec.app'
    - '+.helpshift.com'
    - '+.sentry.io'
    - '+.epicgames.com'
    - '+.epicgames.dev'
    - '+.battle.net'
    - '+.blizzard.com'
    - '+.battlenet.com.cn'

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114

  # 默认解析：只走代理通道的加密 DoH（# 后为出站分组，双保险之一）
  nameserver:
    - 'https://dns.google/dns-query#🚀 节点选择'
    - 'https://dns.cloudflare.com/dns-query#🚀 节点选择'

  # 只有国内/内网域名走国内加密 DoH
  nameserver-policy:
    'geosite:cn,private':
      - 'https://dns.alidns.com/dns-query'
      - 'https://doh.pub/dns-query'
[custom]
; ====================================================================
; .9 旁路由 OpenClash 订阅配置 —— 2026-10-27 优化版
; 本次改动（防"手动节点死了就打不开"）：
;   1) 新增 🛟 故障转移（fallback）：日本 → 新加坡 → 美国cn2 → 美国10u，前一个死了自动顺延（不含 CF）
;   2) 🐟 漏网之鱼 / 🚀 节点选择 默认都指向 🛟 故障转移；漏网之鱼不再列单个节点，避免手动钉死
;   3) 新增 🇯🇵 日本优先：.jp 域名和日本 IP 走日本节点，日本节点全死时回落到 🛟 故障转移
;   4) 测速地址全部改 HTTPS（新加坡节点测 http 的 gstatic 会误判超时），间隔 300 秒改 120 秒
;   5) 🚀 节点选择 去掉 DIRECT（境外 DNS 走这个组，选成 DIRECT 会导致 DNS 直连）
; 注意：DNS 不在本文件里控制（订阅转换用自带模板），由路由器上
;       /etc/openclash/custom/dns_privacy.yaml 经覆写脚本整段替换
; ====================================================================

