; ====================== 分组 ======================
; ---- 兜底核心：按顺序用第一个活节点，死了自动顺延 ----
; 不放 CF 节点：CF Workers 访问不了 Cloudflare 托管的网站（测 cp.cloudflare.com 也全失败），兜底没意义；CF 只给油管做备用
custom_proxy_group=🛟 故障转移`fallback`(日本)`(新加坡)`(cn2)`(美国10u)`https://cp.cloudflare.com/generate_204`120
custom_proxy_group=♻️ 自动选择`url-test`(日本|新加坡|美国)`https://www.gstatic.com/generate_204`120,,100
custom_proxy_group=🇯🇵 日本优先`fallback`(日本)`[]🛟 故障转移`https://cp.cloudflare.com/generate_204`120

